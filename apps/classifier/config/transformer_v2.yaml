# Transformer v2 config — raw metadata, Gemini-labeled training
# text_builder outputs ONLY: name, file_count, size, extensions, folders, largest_files
# No regex, no feature engineering — the model learns from data

text_builder:
  max_name_chars: 300

transformer:
  model_name: sentence-transformers/all-MiniLM-L12-v2
  batch_size: 16
  max_length: 256
  epochs: 4
  learning_rate: 2e-5
  warmup_ratio: 0.1
  weight_decay: 0.01
  grad_clip: 1.0

classifier:
  confidence_threshold: 0.45
