# MLP + TF-IDF classifier config
# No regex — learns patterns from raw data via TF-IDF

text_builder:
  max_name_chars: 300

feature_extractor:
  numeric_features:
    - file_count
    - total_size_bytes
    - avg_file_size
    - max_file_size
    - min_file_size
    - num_extensions
    - num_folders
    - largest_file_ratio
    - log_file_count
    - log_total_size
    - log_avg_file_size
    - log_max_file_size
    - max_to_total_ratio
    - min_to_max_ratio
    - ext_per_file

mlp:
  hidden_layer_sizes: [256, 128, 64]
  activation: relu
  solver: adam
  alpha: 0.0005
  batch_size: 128
  max_iter: 300
  early_stopping: true
  random_state: 42

tfidf:
  word_analyzer: word
  word_ngram_range: [1, 3]
  word_min_df: 2
  word_max_features: 20000
  char_analyzer: char_wb
  char_ngram_range: [3, 5]
  char_min_df: 3
  char_max_features: 20000

classifier:
  type: mlp
  confidence_threshold: 0.45

xgboost:
  n_estimators: 150
  max_depth: 6
  learning_rate: 0.15
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 3
  gamma: 0.1
  reg_alpha: 0.1
  reg_lambda: 1.0
