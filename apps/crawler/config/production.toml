# Production profile (gaia-node).
# Baseline defaults are inherited from default.toml; values here specialize for production.
# This file is the SINGLE SOURCE OF TRUTH for production crawler tuning.

# Top-level operational tuning
worker_threads = 4
nodes = 1
port_base = 6882
channel_capacity = 16384
trace_sample_rate = 0.01

[dht]
walker_alpha = 3
walker_interval_ms = 10
walker_self_explore_prob = 0.25
sybil_count = 1024
sybil_bep42_ratio = 1.0
find_node_response_percent = 100
source_deadline_ms = 12000
source_max_queries = 64
source_query_timeout_secs = 5
rate_limit_per_sec = 8.0

[fetch]
pipeline_limit = 3600
global_fetch_limit = 1800
race_peers = 8
metadata_timeout_secs = 25
connect_deadline_ms = 10000
lead_source_grace_ms = 1000
tcp_timeout_secs = 3
utp_timeout_secs = 5
utp_enabled = true
max_connections_per_ip = 2
transport_race_concurrent = true
ip_cooldown_secs = 180
ip_cooldown_max_entries = 50000
abuse_blacklist_path = "/etc/crawler/config/abuse_blacklist.txt"
conn_limiter_ttl_secs = 60
conn_limiter_max_entries = 80000
fresh_channel_capacity = 32768

[cache]
peer_cache_ttl_secs = 120
peer_cache_max_entries = 60000
announce_cache_max_entries = 30000
peer_cache_failure_threshold = 1

[retry]
no_peers_terminal_on_first = false
no_peers_max_retries = 3
scheduler_interval_secs = 20
scheduler_claim_limit = 600

[storage]
janitor_interval_secs = 60
janitor_batch_size = 10000
janitor_batch_sleep_ms = 25
janitor_dead_retention_secs = 3600
metrics_flush_interval_secs = 15

[logging]
log_dir = "/data/logs"
log_json = true
log_file_max_bytes = 5242880
log_total_max_bytes = 524288000
log_flush_interval_ms = 500
log_buffer_capacity = 16384
