[package]
name = "crawler"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "2"

[dependencies]
bincode = "1.3"
bytes = "1.12.1"
dashmap = "6.2.1"
hmac = "0.13.0"
librqbit-utp = "0.7.0"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
socket2 = { version = "0.6.5", features = ["all"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "json", "migrate", "chrono"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = "0.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
libc = "0.2.169"
