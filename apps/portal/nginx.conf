proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=api_cache:10m max_size=256m inactive=2m use_temp_path=off;

# Internal/private networks are exempt from public API rate limiting
geo $rate_limit_bypass {
    default 1;
    127.0.0.1/32 0;
    192.168.0.0/16 0;
    10.0.0.0/8 0;
    172.16.0.0/12 0;
}

map $rate_limit_bypass $limit_key {
    0 "";
    1 $binary_remote_addr;
}

limit_req_zone $limit_key zone=api_limit:10m rate=50r/s;

upstream api_backend {
    server api:5000;
    keepalive 128;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}

server {
    listen 3005;
    server_name localhost;

    # Gzip compression for JSON API responses
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;
    gzip_comp_level 6;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Static assets: aggressive browser caching
        location ~* \.(js|css|png|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    location /api/stats {
        limit_req zone=api_limit burst=150 nodelay;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Stats: micro-cache 10s — refreshes fast in background
        proxy_cache api_cache;
        proxy_cache_valid 200 10s;
        proxy_cache_key "$uri";
        proxy_cache_use_stale updating error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location /api/torrents {
        limit_req zone=api_limit burst=150 nodelay;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering on;
        proxy_read_timeout 60s;

        # Torrents Search/Browse: micro-cache 5s with stale-while-revalidate
        # Serves repeated searches and catalog queries in <0.5ms while absorbing launch spikes
        proxy_cache api_cache;
        proxy_cache_valid 200 5s;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_use_stale updating error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location /api/live/stream {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /api {
        limit_req zone=api_limit burst=150 nodelay;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
