proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=api_cache:10m max_size=256m inactive=2m use_temp_path=off;

server {
    listen 3005;
    server_name localhost;

    # Gzip compression for JSON API responses
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;
    gzip_comp_level 6;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Static assets: aggressive browser caching
        location ~* \.(js|css|png|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    location /api/stats {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Stats: micro-cache 10s — refreshes fast in background
        proxy_cache api_cache;
        proxy_cache_valid 200 10s;
        proxy_cache_key "$uri";
        proxy_cache_use_stale updating error timeout;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location /api/torrents {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering on;
        proxy_read_timeout 60s;

        # Micro-cache: 5s — collapses thundering herds on identical searches
        # The Redis layer in the API handles longer-lived caching
        proxy_cache api_cache;
        proxy_cache_valid 200 5s;
        proxy_cache_key "$uri$is_args$args";
        proxy_cache_use_stale updating error timeout;
        proxy_cache_lock on;           # Collapses concurrent identical requests into one upstream call
        proxy_cache_lock_timeout 3s;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location /api {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
