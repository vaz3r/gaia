version: '0.8'
index_id: torrents
doc_mapping:
  field_mappings:
    - name: infohash
      type: text
      tokenizer: raw
      stored: true
      fast: true
    - name: name
      type: text
      tokenizer: default
      record: freq
      stored: true
    - name: category
      type: text
      tokenizer: raw
      stored: true
      fast: true
    - name: total_size
      type: i64
      stored: true
      fast: true
    - name: file_count
      type: i64
      stored: true
      fast: true
    - name: verified_at
      type: datetime
      fast_precision: seconds
      stored: true
      fast: true
    - name: health_score
      type: i64
      stored: true
      fast: true
    - name: popularity_score
      type: i64
      stored: true
      fast: true
    - name: swarm_peers
      type: i64
      stored: true
      fast: true
    - name: seed_confirmed
      type: bool
      stored: true
      fast: true
    - name: risk_tier
      type: text
      tokenizer: raw
      stored: true
      fast: true
    - name: policy_action
      type: text
      tokenizer: raw
      stored: true
      fast: true

indexing_settings:
  commit_timeout_secs: 10

search_settings:
  default_search_fields: [name]
