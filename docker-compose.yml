# dht-crawler behind Gluetun WireGuard -> Oracle public IP.
#
# Secrets come from dht-crawler/.env (gitignored); see .env.example for the
# variable names.
#
#   cp .env.example .env   # then fill in WireGuard keys
#   docker compose up -d --build

services:
  gluetun:
    image: qmcgaw/gluetun:v3.40.0
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - gaia
    environment:
      # WireGuard / custom provider
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=10.8.0.9/24
      - WIREGUARD_PRESHARED_KEY=${WIREGUARD_PRESHARED_KEY}
      - WIREGUARD_PUBLIC_KEY=${SERVER_PUBLIC_KEY}
      - WIREGUARD_ENDPOINT_IP=132.145.189.201
      - WIREGUARD_ENDPOINT_PORT=443
      # The tunnel's private DNS (10.8.1.3) is unreachable from this host, so
      # use public resolvers through the tunnel. Compose service names are
      # resolved by the crawler directly via Docker's embedded DNS (see the
      # crawler entrypoint), not through gluetun.
      - DNS_UPSTREAM_PLAIN_ADDRESSES=1.1.1.1:53,8.8.8.8:53
      # Allow inbound DHT queries to reach the crawler through the tunnel.
      - FIREWALL_VPN_INPUT_PORTS=6881,6882,6883,6884,6885,6886,6887,6888
      - TZ=UTC
    healthcheck:
      # Gluetun's own health server (127.0.0.1:9999) reflects tunnel
      # connectivity (TCP+TLS dial to HEALTH_TARGET_ADDRESSES); use it as the
      # authoritative tunnel-up signal rather than an external wget/curl.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--timeout=5", "http://127.0.0.1:9999/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    container_name: redis
    hostname: redis
    restart: unless-stopped
    # Durable shared state: the crawler's node pool, per-instance node IDs, and
    # sampler quality maps live here (Redis is the only state store — no files).
    # AOF every 1s + a named volume so state survives restarts.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
    volumes:
      - redis-data:/data
    networks:
      - gaia
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  postgres:
    # pgvector/pgvector ships the `vector` extension atop postgres 16 — the
    # plain postgres image does not include it.
    image: pgvector/pgvector:pg16
    container_name: postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=crawler
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=crawler
    networks:
      - gaia
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    # Tuned for the crawler platform: index data is re-crawlable, so we relax
    # fsync durability (synchronous_commit=off) for write throughput. The host
    # has ~4 GB free RAM beyond the crawler's ~230 MB.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_wal_size=1GB
      - -c
      - synchronous_commit=off
      # Bounds admin/search queries so a bad query cannot pin the DB.
      - -c
      - statement_timeout=30s
      # Autovacuum aggressive enough for the update-heavy `scanned` table.
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_analyze_scale_factor=0.02
      - -c
      - max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crawler -d crawler"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  crawler:
    build:
      context: .
      dockerfile: crawler/Dockerfile
    container_name: crawler
    restart: unless-stopped
    # Bound the crawler so a runaway can't OOM/swap the host. The DHT node +
    # fetch pool at --scale 1 stays well under 512 MiB in practice (~308 MB
    # measured at scale 3); 1 GiB leaves headroom for jemalloc spikes.
    mem_limit: 8g
    pids_limit: 8192
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Share Gluetun's network namespace: all crawler traffic egresses via the
    # WireGuard tunnel from the Oracle public IP. Redis/Postgres are reached on
    # the local compose network (via gluetun's shared eth0) by hostname. The
    # crawler's entrypoint points /etc/resolv.conf at Docker's embedded DNS
    # (127.0.0.11), which resolves compose service names inside gluetun's netns.
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - dht-data:/data
    environment:
      - REDIS_URL=redis://redis:6379
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # jemalloc profiler off in production: stats_print dumps ~30k lines to
      # logs on EVERY subcommand exit. Set GAIA_PROF_DUMP_EVERY_TICKS>0 + the
      # _RJEM_MALLOC_CONF when debugging memory.
      - GAIA_PROF_DUMP_EVERY_TICKS=0
      - MALLOC_CONF=background_thread:true,dirty_decay_ms:1000,muzzy_decay_ms:0
    healthcheck:
      # Real HTTP health endpoint: the crawler binds --health-port inside
      # gluetun's shared netns, so localhost works from this container.
      test: ["CMD", "sh", "-c", "curl -sf http://127.0.0.1:9777/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    command:
      - run
      - --pg
      - postgres://crawler:${POSTGRES_PASSWORD}@postgres:5432/crawler_bench8
      - --port
      - "6881"
      - --health-port
      - "9777"
      - --instances
      - "4"
      - --min-seen
      - "1"
      - --min-seen-shadow
      - "0"
      - --min-sightings
      - "1"
      - --scale
      - "10"
      - --concurrency
      - "100"
      - --lookup-concurrency
      - "100"
      - --sampler-qps
      - "800"
      - --sampler-loops
      - "512"
      - --max-nodes
      - "1000000"
      - --max-attempts
      - "4"
      - --no-restrict-ips
      - --qps
      - "8000"
      - --redis-url
      - redis://redis:6379
      - --redis-prefix
      - "dhtbench8"
      - --log
      - crawler=info
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  api:
    build:
      context: api
      dockerfile: Dockerfile
    container_name: gaia-api
    restart: unless-stopped
    networks:
      - gaia
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://crawler:${POSTGRES_PASSWORD}@postgres:5432/crawler
      - REDIS_URL=redis://redis:6379
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  dashboard:
    build:
      context: dashboard
      dockerfile: Dockerfile
    container_name: gaia-dashboard
    restart: unless-stopped
    networks:
      - gaia
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

volumes:
  dht-data:
    name: dht-crawler-data
  pg-data:
    name: dht-crawler-pg-data
  redis-data:
    name: dht-crawler-redis-data

networks:
  gaia:
    driver: bridge
