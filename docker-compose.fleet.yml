# dht-crawler fleet: N independent gluetun+crawler pairs, each with its own
# WireGuard tunnel (unique public IP) and Redis key namespace.
#
# Two crawler groups by default (CRAWLER_GROUPS env or edit the anchor list).
# Each group i uses:
#   - gluetun-i: its own WIREGUARD_*_i endpoint + FIREWALL_VPN_INPUT_PORTS
#   - crawler-i: network_mode service:gluetun-i, --redis-prefix c<i>, and its
#     own UDP port so a group's DHT sockets don't clash inside its tunnel.
#
# Postgres/Redis/api/dashboard are shared (dedup by info_hash primary key).
#
#   WIREGUARD_PRIVATE_KEY_1=... SERVER_PUBLIC_KEY_1=... docker compose \
#     -f docker-compose.fleet.yml up -d --build
#
# Secrets for each group come from the matching _1/_2/... env vars; the single
# -instance defaults are reused from .env when a group var is absent.

x-crawler-base: &crawler-base
  build:
    context: .
    dockerfile: crawler/Dockerfile
  restart: unless-stopped
  mem_limit: 1g
  pids_limit: 8192
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
  volumes:
    - dht-data:/data
  environment:
    - REDIS_URL=redis://redis:6379
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - GAIA_PROF_DUMP_EVERY_TICKS=0
  healthcheck:
    test: ["CMD", "sh", "-c", "test \"$(cat /proc/1/comm 2>/dev/null)\" = crawler"]
    interval: 60s
    timeout: 10s
    retries: 3
    start_period: 30s
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "3"

x-gluetun-base: &gluetun-base
  image: qmcgaw/gluetun:v3.40.0
  restart: unless-stopped
  cap_add:
    - NET_ADMIN
  devices:
    - /dev/net/tun:/dev/net/tun
  networks:
    - gaia
  environment:
    - VPN_SERVICE_PROVIDER=custom
    - VPN_TYPE=wireguard
    - DNS_UPSTREAM_PLAIN_ADDRESSES=1.1.1.1:53,8.8.8.8:53
    - TZ=UTC
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "--timeout=5", "http://127.0.0.1:9999/health"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 20s
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "3"

services:
  # --- Crawler group 1 -----------------------------------------------------
  gluetun-1:
    <<: *gluetun-base
    container_name: gluetun-1
    environment:
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY_1:-${WIREGUARD_PRIVATE_KEY}}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES_1:-10.8.0.9/24}
      - WIREGUARD_PRESHARED_KEY=${WIREGUARD_PRESHARED_KEY_1:-${WIREGUARD_PRESHARED_KEY}}
      - WIREGUARD_PUBLIC_KEY=${SERVER_PUBLIC_KEY_1:-${SERVER_PUBLIC_KEY}}
      - WIREGUARD_ENDPOINT_IP=${WIREGUARD_ENDPOINT_IP_1:-132.145.189.201}
      - WIREGUARD_ENDPOINT_PORT=${WIREGUARD_ENDPOINT_PORT_1:-443}
      - FIREWALL_VPN_INPUT_PORTS=${FIREWALL_VPN_INPUT_PORTS_1:-6881,6882,6883,6884}
      - DNS_UPSTREAM_PLAIN_ADDRESSES=1.1.1.1:53,8.8.8.8:53
      - TZ=UTC

  crawler-1:
    <<: *crawler-base
    container_name: crawler-1
    network_mode: "service:gluetun-1"
    depends_on:
      gluetun-1:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command:
      - run
      - --pg
      - postgres://crawler:${POSTGRES_PASSWORD}@postgres:5432/crawler
      - --port
      - "6881"
      - --health-port
      - "9777"
      - --instances
      - "8"
      - --min-seen
      - "3"
      - --min-seen-shadow
      - "3"
      - --min-sightings
      - "2"
      - --scale
      - "1"
      - --max-nodes
      - "8192"
      - --max-attempts
      - "4"
      - --no-restrict-ips
      - --redis-url
      - redis://redis:6379
      - --redis-prefix
      - "c1"
      - --log
      - crawler=info

  # --- Crawler group 2 -----------------------------------------------------
  gluetun-2:
    <<: *gluetun-base
    container_name: gluetun-2
    environment:
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY_2:-${WIREGUARD_PRIVATE_KEY}}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES_2:-10.8.0.10/24}
      - WIREGUARD_PRESHARED_KEY=${WIREGUARD_PRESHARED_KEY_2:-${WIREGUARD_PRESHARED_KEY}}
      - WIREGUARD_PUBLIC_KEY=${SERVER_PUBLIC_KEY_2:-${SERVER_PUBLIC_KEY}}
      - WIREGUARD_ENDPOINT_IP=${WIREGUARD_ENDPOINT_IP_2:-132.145.189.201}
      - WIREGUARD_ENDPOINT_PORT=${WIREGUARD_ENDPOINT_PORT_2:-443}
      - FIREWALL_VPN_INPUT_PORTS=${FIREWALL_VPN_INPUT_PORTS_2:-6885,6886,6887,6888}
      - DNS_UPSTREAM_PLAIN_ADDRESSES=1.1.1.1:53,8.8.8.8:53
      - TZ=UTC

  crawler-2:
    <<: *crawler-base
    container_name: crawler-2
    network_mode: "service:gluetun-2"
    depends_on:
      gluetun-2:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command:
      - run
      - --pg
      - postgres://crawler:${POSTGRES_PASSWORD}@postgres:5432/crawler
      - --port
      - "6881"
      - --health-port
      - "9777"
      - --instances
      - "8"
      - --min-seen
      - "3"
      - --min-seen-shadow
      - "3"
      - --min-sightings
      - "2"
      - --scale
      - "1"
      - --max-nodes
      - "8192"
      - --max-attempts
      - "4"
      - --no-restrict-ips
      - --redis-url
      - redis://redis:6379
      - --redis-prefix
      - "c2"
      - --log
      - crawler=info

  # --- Shared infrastructure ----------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: redis
    hostname: redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
    volumes:
      - redis-data:/data
    networks:
      - gaia
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=crawler
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=crawler
    networks:
      - gaia
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_wal_size=1GB
      - -c
      - synchronous_commit=off
      - -c
      - statement_timeout=30s
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_analyze_scale_factor=0.02
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crawler -d crawler"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  api:
    build:
      context: api
      dockerfile: Dockerfile
    container_name: gaia-api
    restart: unless-stopped
    networks:
      - gaia
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://crawler:${POSTGRES_PASSWORD}@postgres:5432/crawler
      - REDIS_URL=redis://redis:6379
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  dashboard:
    build:
      context: dashboard
      dockerfile: Dockerfile
    container_name: gaia-dashboard
    restart: unless-stopped
    networks:
      - gaia
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

volumes:
  dht-data:
    name: dht-crawler-data
  pg-data:
    name: dht-crawler-pg-data
  redis-data:
    name: dht-crawler-redis-data

networks:
  gaia:
    driver: bridge
