schema: spec-driven

context: |
  Language: Rust (edition 2021), async runtime: tokio
  Project: crawler — a lightweight, high-throughput BitTorrent DHT crawler that
  indexes movie and TV torrents into a local SQLite database.
  Stack: gaia-dht (owned irontide-dht fork, Kademlia DHT actor, BEP 51
  sample_infohashes, persistent routing table), rusqlite (SQLite storage), clap
  (CLI), tracing (logging).
  Protocol: BEP 5 (DHT), BEP 10 (extension protocol), BEP 9 (ut_metadata), BEP 51
  (DHT infohash indexing).
  Key principles: zero TCP for crawling itself (UDP DHT only); names come ONLY from
  BEP 9 metadata fetches (BEP 51 responses carry no names); persistent routing table
  across restarts; polite rate limiting (respect BEP 51 interval backoff).
  Testing: cargo test for filters/storage, cargo clippy before merge.

rules:
  proposal:
    - State every prior failure mode this change addresses
    - List all new capabilities with kebab-case paths
  specs:
    - Use SHALL/MUST for normative requirements
    - Every requirement SHALL have at least one scenario
  design:
    - Record alternatives considered for each decision
    - Note GPL-3.0 licensing implications of irontide-dht