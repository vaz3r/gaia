[package]
name = "crawler"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Lightweight BitTorrent DHT crawler indexing movie/TV torrents into SQLite"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
dashmap = "6"
futures-util = "0.3"
gaia-bencode = { path = "crates/gaia-bencode" }
gaia-core = { path = "crates/gaia-core" }
gaia-dht = { path = "crates/gaia-dht" }
gaia-wire = { path = "crates/gaia-wire" }
jemalloc-ctl = "0.5"
jemalloc-sys = { version = "0.5", default-features = false }
jemallocator = { version = "0.5", features = ["profiling", "stats"] }
rand = "0.8"
redis = { version = "1.5", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha1 = "0.10"
smallvec = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
