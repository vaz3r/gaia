# dht-crawler behind Gluetun WireGuard -> Oracle public IP.
#
# Secrets come from dht-crawler/.env (gitignored); see .env.example for the
# variable names.
#
#   cp .env.example .env   # then fill in WireGuard keys
#   docker compose up -d --build

services:
  gluetun:
    image: qmcgaw/gluetun:v3.40.0
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      # WireGuard / custom provider
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=10.8.0.9/24
      - WIREGUARD_PRESHARED_KEY=${WIREGUARD_PRESHARED_KEY}
      - WIREGUARD_PUBLIC_KEY=${SERVER_PUBLIC_KEY}
      - WIREGUARD_ENDPOINT_IP=132.145.189.201
      - WIREGUARD_ENDPOINT_PORT=443
      # The tunnel's private DNS (10.8.1.3) is unreachable from this host, so
      # use public resolvers through the tunnel instead.
      - DNS_UPSTREAM_PLAIN_ADDRESSES=1.1.1.1:53,8.8.8.8:53
      # Allow inbound DHT queries to reach the crawler through the tunnel.
      - FIREWALL_VPN_INPUT_PORTS=6881,6882,6883,6884,6885,6886,6887,6888
      - TZ=UTC
    healthcheck:
      # Gluetun's own health server (127.0.0.1:9999) reflects tunnel
      # connectivity (TCP+TLS dial to HEALTH_TARGET_ADDRESSES); use it as the
      # authoritative tunnel-up signal rather than an external wget/curl.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--timeout=5", "http://127.0.0.1:9999/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    container_name: dht-redis
    restart: unless-stopped
    # Local coordination only (seen-set + dead-peer cache); stays on the
    # default compose network so it does not consume tunnel bandwidth.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  crawler:
    build:
      context: ..
      dockerfile: crawler/Dockerfile
    container_name: crawler
    restart: unless-stopped
    # Bound the crawler so a runaway can't OOM/swap the host. The DHT node +
    # fetch pool at --scale 1 stays well under 512 MiB in practice (~308 MB
    # measured at scale 3); 1 GiB leaves headroom for jemalloc spikes.
    mem_limit: 1g
    pids_limit: 8192
    # Share Gluetun's network namespace: all crawler traffic egresses via the
    # WireGuard tunnel from the Oracle public IP. Redis is reached on the local
    # compose network (via gluetun's shared eth0), so coordination is free.
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - dht-data:/data
    environment:
      - REDIS_URL=redis://redis:6379
      # jemalloc profiler off in production: stats_print dumps ~30k lines to
      # logs on EVERY subcommand exit. Set GAIA_PROF_DUMP_EVERY_TICKS>0 + the
      # _RJEM_MALLOC_CONF when debugging memory.
      - GAIA_PROF_DUMP_EVERY_TICKS=0
    healthcheck:
      # The crawler is a UDP daemon with no HTTP surface; the DB WAL file is
      # touched by the write loop on every flush, so a fresh mtime means the
      # process is alive and writing.
      test: ["CMD", "sh", "-c", "test -n \"$(pgrep -f 'crawler run')\" && find /data -name 'crawler.sqlite*' -mmin -5 | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    command:
      - run
      - --db
      - /data/crawler.sqlite
      - --state-dir
      - /data/state
      - --port
      - "6881"
      - --instances
      - "8"
      - --min-seen
      - "1"
      - --min-seen-shadow
      - "3"
      - --scale
      - "1"
      - --max-nodes
      - "8192"
      - --max-attempts
      - "2"
      - --no-restrict-ips
      - --redis-url
      - redis://redis:6379
      - --log
      - crawler=info
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

volumes:
  dht-data:
    name: dht-crawler-data
