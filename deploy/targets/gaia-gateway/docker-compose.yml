name: gaia-gateway

services:
  nginx:
    image: nginx:alpine
    container_name: gaia-gateway-nginx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/custom_error.json:/var/www/html/custom_error.json:ro
      - /etc/ssl/certs/gateway.crt:/etc/ssl/certs/gateway.crt:ro
      - /etc/ssl/private/gateway.key:/etc/ssl/private/gateway.key:ro
      - /etc/ssl/gaia-ca/ca.crt:/etc/ssl/certs/gaia-internal-ca.crt:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --cacert /etc/ssl/certs/gaia-internal-ca.crt -s -f https://127.0.0.1/api/stats >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      wireguard:
        condition: service_healthy

  wstunnel:
    build:
      context: ../../../apps/tunnel
      dockerfile: Dockerfile
    image: gaia-tunnel:${GIT_COMMIT:-latest}
    container_name: gaia-gateway-wstunnel
    restart: unless-stopped
    network_mode: host
    command:
      - "wstunnel-server"
      - "--restrict-to"
      - "127.0.0.1:51820"
      - "ws://127.0.0.1:${WSTUNNEL_PORT:-8443}"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${WSTUNNEL_PORT:-8443} || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  wireguard:
    build:
      context: ../../../apps/tunnel
      dockerfile: Dockerfile
    image: gaia-tunnel:${GIT_COMMIT:-latest}
    container_name: gaia-gateway-wireguard
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - /dev/net/tun:/dev/net/tun
      - ./wireguard/wg0.conf:/etc/wireguard/wg0.conf:ro
    command: ["wireguard", "/etc/wireguard/wg0.conf"]
    healthcheck:
      test: ["CMD-SHELL", "ip link show wg0 >/dev/null 2>&1 && ip addr show wg0 | grep -q 10.99.0.1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      wstunnel:
        condition: service_healthy

