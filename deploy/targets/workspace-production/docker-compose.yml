name: gaia-production

services:
  dashboard:
    build:
      context: ../../../apps/dashboard
      dockerfile: Dockerfile
    image: gaia-dashboard:${GIT_COMMIT:-latest}
    container_name: gaia-dashboard
    init: true
    restart: unless-stopped
    network_mode: host
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-crawler}:${PG_PASSWORD}@${DB_HOST}:${PG_PORT:-5432}/${POSTGRES_DB:-craw}?sslmode=disable
      PORT: ${DASH_PORT:-3000}
      LOGS_DIR: /mnt/gaia/logs/crawler
    volumes:
      - /mnt/gaia/logs/crawler:/mnt/gaia/logs/crawler:ro

  log-receiver:
    build:
      context: ../../../apps/log-receiver
    image: gaia-log-receiver:${GIT_COMMIT:-latest}
    container_name: gaia-log-receiver
    restart: unless-stopped
    environment:
      STORAGE_DIR: /logs
      API_KEY: ${LOG_SHIPPER_API_KEY}
      PORT: 3000
    ports:
      - "100.87.194.112:3100:3000"
    volumes:
      - /mnt/gaia/logs/crawler:/logs

  postgres:
    image: postgres:16
    container_name: gaia-postgres
    restart: unless-stopped
    shm_size: 2gb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crawler}
      POSTGRES_DB: ${POSTGRES_DB:-craw}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    networks:
      default:
        aliases:
          - postgres
          - gaia-postgres
    volumes:
      - /home/${DEPLOY_USER:-core}/gaia-data/postgres:/var/lib/postgresql/data
      - ../../../deploy/postgres/postgresql.workspace-production.conf:/etc/postgresql/production.conf
    command: ["postgres", "-c", "config_file=/etc/postgresql/production.conf"]

  log-analyzer:
    build:
      context: ../../../apps/log-analyzer
    image: gaia-log-analyzer:${GIT_COMMIT:-latest}
    container_name: gaia-log-analyzer
    restart: unless-stopped
    environment:
      LOGS_DIR: /logs
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - /mnt/gaia/logs/crawler:/logs:ro

  backup:
    build:
      context: ../../../apps/backup
    image: gaia-backup:${GIT_COMMIT:-latest}
    container_name: gaia-backup
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-crawler}
      POSTGRES_DB: ${POSTGRES_DB:-craw}
      PG_PASSWORD: ${PG_PASSWORD}
      RCLONE_REMOTE_PATH: "gdrive:/"
      BACKUP_CRON: "0 2 * * *"
      BACKUP_KEEP_COUNT: "2"
    networks:
      - default
    volumes:
      - /home/${DEPLOY_USER:-core}/gaia-data/rclone:/root/.config/rclone

  classifier-api:
    build:
      context: ../../../apps/classifier
      dockerfile: Dockerfile
    image: gaia-classifier-api:${GIT_COMMIT:-latest}
    container_name: gaia-classifier-api
    restart: unless-stopped
    network_mode: host
    environment:
      DB_HOST: localhost
      PG_PORT: ${PG_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-crawler}
      POSTGRES_DB: ${POSTGRES_DB:-craw}
      PG_PASSWORD: ${PG_PASSWORD}
      PORT: ${CLASSIFIER_PORT:-8080}
    volumes:
      - /home/${DEPLOY_USER:-core}/gaia-data/classifier/models:/app/models
    command: ["uvicorn", "web.app:app", "--host", "0.0.0.0", "--port", "8080"]

  classifier-worker:
    build:
      context: ../../../apps/classifier
      dockerfile: Dockerfile
    image: gaia-classifier-worker:${GIT_COMMIT:-latest}
    container_name: gaia-classifier-worker
    restart: unless-stopped
    network_mode: host
    environment:
      DB_HOST: localhost
      PG_PORT: ${PG_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-crawler}
      POSTGRES_DB: ${POSTGRES_DB:-craw}
      PG_PASSWORD: ${PG_PASSWORD}
      WORKER_BATCH_SIZE: 2000
      WORKER_POLL_INTERVAL: 15
    volumes:
      - /home/${DEPLOY_USER:-core}/gaia-data/classifier/models:/app/models
    command: ["python", "scripts/worker.py"]

  anomaly-worker:
    build:
      context: ../../../apps/ml/anomalies
      dockerfile: Dockerfile
    image: gaia-anomaly-worker:${GIT_COMMIT:-latest}
    container_name: gaia-anomaly-worker
    restart: unless-stopped
    network_mode: host
    environment:
      DB_HOST: localhost
      PG_PORT: ${PG_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-crawler}
      POSTGRES_DB: ${POSTGRES_DB:-craw}
      PG_PASSWORD: ${PG_PASSWORD}
      LOG_ANALYZER_URL: http://localhost:3001
      DETECTION_INTERVAL_MINUTES: 15
      RETRAIN_INTERVAL_HOURS: 24
      ALERT_MIN_SCORE: 0.60
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      LOG_LEVEL: INFO
    volumes:
      - /home/${DEPLOY_USER:-core}/gaia-data/anomalies/models:/app/models_storage
      - /home/${DEPLOY_USER:-core}/gaia-data/anomalies/data:/app/data

  scoring-worker:
    build:
      context: ../../../apps/ml/scoring
      dockerfile: Dockerfile
    image: gaia-scoring-worker:${GIT_COMMIT:-latest}
    container_name: gaia-scoring-worker
    restart: unless-stopped
    network_mode: host
    environment:
      DB_HOST: localhost
      PG_PORT: ${PG_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-crawler}
      POSTGRES_DB: ${POSTGRES_DB:-craw}
      PG_PASSWORD: ${PG_PASSWORD}
      BATCH_SIZE: 500
      POLL_INTERVAL: 5
      RETRAIN_INTERVAL_HOURS: 168
      AVAILABILITY_REFRESH_HOURS: 24
      LOG_LEVEL: INFO
    volumes:
      - /home/${DEPLOY_USER:-core}/gaia-data/scoring/models:/app/model_registry
      - /home/${DEPLOY_USER:-core}/gaia-data/scoring/reports:/app/reports

