name: gaia-production

services:
  dashboard:
    build:
      context: ../../..
      dockerfile: apps/dashboard/Dockerfile
    image: gaia-dashboard:${GIT_COMMIT:-latest}
    container_name: gaia-dashboard
    init: true
    restart: unless-stopped
    network_mode: host
    environment:
      DATABASE_URL: Host=localhost;Port=6432;Database=craw;Username=${POSTGRES_USER:-crawler};Password=${PG_PASSWORD};Pooling=true;Maximum Pool Size=10;Minimum Pool Size=2;Command Timeout=10;Timeout=5;Max Auto Prepare=0;No Reset On Close=true;
      SEARCH_PROVIDER: PostgreSQL
      ASPNETCORE_URLS: http://0.0.0.0:${DASH_PORT:-3000}
      PORT: ${DASH_PORT:-3000}
      GAIA_ADMIN_TOKEN: ${GAIA_ADMIN_TOKEN:-}
      CLASSIFIER_API_URL: ${CLASSIFIER_API_URL:-http://127.0.0.1:8080}

  logger:
    build:
      context: ../../../apps/logger
    image: gaia-logger:${GIT_COMMIT:-latest}
    container_name: gaia-logger
    restart: unless-stopped
    profiles:
      - logging
    environment:
      LOG_PROFILE: server
      STORAGE_DIR: /logs
      LOGS_DIR: /logs
      RECEIVER_PORT: 3000
      ANALYZER_PORT: 3001
      API_KEY: ${LOG_SHIPPER_API_KEY}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-7}
      LOG_JANITOR_INTERVAL_MS: ${LOG_JANITOR_INTERVAL_MS:-3600000}
    ports:
      - "100.87.194.112:3100:3000"
      - "3001:3001"
    volumes:
      - /mnt/gaia/logs/crawler:/logs


  postgres:
    image: postgres:16
    container_name: gaia-postgres
    restart: unless-stopped
    shm_size: 2gb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crawler}
      POSTGRES_DB: ${POSTGRES_DB:-craw}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    networks:
      default:
        aliases:
          - postgres
          - gaia-postgres
    volumes:
      - /home/${DEPLOY_USER:-core}/gaia-data/postgres:/var/lib/postgresql/data
      - ../../../deploy/postgres/postgresql.workspace-production.conf:/etc/postgresql/production.conf
    command: ["postgres", "-c", "config_file=/etc/postgresql/production.conf"]


  backup:
    build:
      context: ../../../apps/backup
    image: gaia-backup:${GIT_COMMIT:-latest}
    container_name: gaia-backup
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-crawler}
      POSTGRES_DB: ${POSTGRES_DB:-craw}
      PG_PASSWORD: ${PG_PASSWORD}
      RCLONE_REMOTE_PATH: "gdrive:/"
      BACKUP_CRON: "0 2 * * *"
      BACKUP_KEEP_COUNT: "2"
    networks:
      - default
    volumes:
      - /home/${DEPLOY_USER:-core}/gaia-data/rclone:/root/.config/rclone

  classifier-api:
    build:
      context: ../../../apps/classifier
      dockerfile: Dockerfile
    image: gaia-classifier-api:${GIT_COMMIT:-latest}
    container_name: gaia-classifier-api
    restart: unless-stopped
    network_mode: host
    environment:
      DB_HOST: localhost
      PG_PORT: ${PG_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-crawler}
      POSTGRES_DB: ${POSTGRES_DB:-craw}
      PG_PASSWORD: ${PG_PASSWORD}
      PORT: ${CLASSIFIER_PORT:-8080}
    volumes:
      - /home/${DEPLOY_USER:-core}/gaia-data/classifier/models:/app/models
    command: ["uvicorn", "web.app:app", "--host", "0.0.0.0", "--port", "8080"]

  classifier-worker:
    build:
      context: ../../../apps/classifier
      dockerfile: Dockerfile
    image: gaia-classifier-worker:${GIT_COMMIT:-latest}
    container_name: gaia-classifier-worker
    restart: unless-stopped
    network_mode: host
    environment:
      DB_HOST: localhost
      PG_PORT: ${PG_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-crawler}
      POSTGRES_DB: ${POSTGRES_DB:-craw}
      PG_PASSWORD: ${PG_PASSWORD}
      WORKER_BATCH_SIZE: 2000
      WORKER_POLL_INTERVAL: 15
    volumes:
      - /home/${DEPLOY_USER:-core}/gaia-data/classifier/models:/app/models
    command: ["python", "scripts/worker.py"]

  anomaly-worker:
    build:
      context: ../../../apps/ml/anomalies
      dockerfile: Dockerfile
    image: gaia-anomaly-worker:${GIT_COMMIT:-latest}
    container_name: gaia-anomaly-worker
    restart: unless-stopped
    network_mode: host
    environment:
      DB_HOST: localhost
      PG_PORT: ${PG_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-crawler}
      POSTGRES_DB: ${POSTGRES_DB:-craw}
      PG_PASSWORD: ${PG_PASSWORD}
      LOG_ANALYZER_URL: http://localhost:3001
      DETECTION_INTERVAL_MINUTES: 15
      RETRAIN_INTERVAL_HOURS: 24
      ALERT_MIN_SCORE: 0.60
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      LOG_LEVEL: INFO
    volumes:
      - /home/${DEPLOY_USER:-core}/gaia-data/anomalies/models:/app/models_storage
      - /home/${DEPLOY_USER:-core}/gaia-data/anomalies/data:/app/data

  scoring-worker:
    build:
      context: ../../../apps/ml/scoring
      dockerfile: Dockerfile
    image: gaia-scoring-worker:${GIT_COMMIT:-latest}
    container_name: gaia-scoring-worker
    restart: unless-stopped
    network_mode: host
    environment:
      DB_HOST: localhost
      PG_PORT: ${PG_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-crawler}
      POSTGRES_DB: ${POSTGRES_DB:-craw}
      PG_PASSWORD: ${PG_PASSWORD}
      BATCH_SIZE: 500
      POLL_INTERVAL: 5
      RETRAIN_INTERVAL_HOURS: 168
      AVAILABILITY_REFRESH_HOURS: 24
      LOG_LEVEL: INFO
    volumes:
      - /home/${DEPLOY_USER:-core}/gaia-data/scoring/models:/app/model_registry
      - /home/${DEPLOY_USER:-core}/gaia-data/scoring/reports:/app/reports

  pgbouncer:
    image: bitnami/pgbouncer:latest
    container_name: gaia-pgbouncer
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRESQL_HOST: "127.0.0.1"
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_DATABASE: "${POSTGRES_DB:-craw}"
      POSTGRESQL_USERNAME: "${POSTGRES_USER:-crawler}"
      POSTGRESQL_PASSWORD: "${PG_PASSWORD}"
      PGBOUNCER_PORT: "6432"
      PGBOUNCER_POOL_MODE: "transaction"
      PGBOUNCER_MAX_CLIENT_CONN: "500"
      PGBOUNCER_DEFAULT_POOL_SIZE: "25"
      PGBOUNCER_MIN_POOL_SIZE: "5"
      PGBOUNCER_RESERVE_POOL_SIZE: "5"
      PGBOUNCER_RESERVE_POOL_TIMEOUT: "3"

  redis:
    image: redis:7-alpine
    container_name: gaia-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "1024mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - /home/${DEPLOY_USER:-core}/gaia-data/redis:/data

  wstunnel-client:
    build:
      context: ../../../apps/tunnel
      dockerfile: Dockerfile
    image: gaia-tunnel:${GIT_COMMIT:-latest}
    container_name: gaia-wstunnel-client
    restart: unless-stopped
    network_mode: host
    command:
      - "wstunnel-client"
      - "--tls-verify-certificate"
      - "--tls-sni-override"
      - "gaia-gateway"
      - "-L"
      - "udp://127.0.0.1:51820:127.0.0.1:51820?timeout_sec=0"
      - "${GATEWAY_WSTUNNEL_URL:-wss://192.168.10.111:8443}"
    volumes:
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    healthcheck:
      test: ["CMD-SHELL", "pidof wstunnel >/dev/null 2>&1 && ss -uln | grep -q '127.0.0.1:51820' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  wireguard-client:
    build:
      context: ../../../apps/tunnel
      dockerfile: Dockerfile
    image: gaia-tunnel:${GIT_COMMIT:-latest}
    container_name: gaia-wireguard-client
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - /dev/net/tun:/dev/net/tun
      - /etc/wireguard/wg0.conf:/etc/wireguard/wg0.conf:ro
    command: ["wireguard", "/etc/wireguard/wg0.conf"]
    healthcheck:
      test: ["CMD-SHELL", "ip link show wg0 >/dev/null 2>&1 && ip addr show wg0 | grep -q 10.99.0.2 && hs=$$(wg show wg0 latest-handshakes | awk '{print $$2}') && case \"$$hs\" in ''|*[!0-9]*) exit 1;; esac && [ \"$$hs\" -gt 0 ] && now=$$(date +%s) && [ $$((now - hs)) -ge 0 ] && [ $$((now - hs)) -le 180 ] && ping -c 1 -W 2 10.99.0.1 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      wstunnel-client:
        condition: service_healthy


