name: gaia-portal-stack

services:
  redis:
    image: redis:7-alpine
    container_name: gaia-portal-redis
    restart: unless-stopped
    network_mode: host
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: gaia-portal-meilisearch
    restart: unless-stopped
    network_mode: host
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-meili_secure_master_key_v2_modern_scaling}
      MEILI_NO_ANALYTICS: "true"
      MEILI_MAX_INDEXING_MEMORY: 4Gb
      MEILI_MAX_INDEXING_THREADS: 3
      MEILI_HTTP_ADDR: 0.0.0.0:7700
    volumes:
      - /var/lib/meilisearch/data:/meili_data

  api:
    build:
      context: ../../../apps/api
      dockerfile: Dockerfile
    image: gaia-portal-api:${GIT_COMMIT:-latest}
    container_name: gaia-portal-api
    restart: unless-stopped
    network_mode: host
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5000
      DATABASE_URL: ${DATABASE_URL:-Host=192.168.10.10;Port=6432;Database=craw;Username=crawler;Password=83fec11c363e2e90cbea2a0303ace95a8b5d4bbaf897fc97f49195ffbbf7978b;Pooling=true;Maximum Pool Size=50;Minimum Pool Size=5;Max Auto Prepare=0;No Reset On Close=true;}
      ConnectionStrings__Postgres: ${DATABASE_URL:-Host=192.168.10.10;Port=6432;Database=craw;Username=crawler;Password=83fec11c363e2e90cbea2a0303ace95a8b5d4bbaf897fc97f49195ffbbf7978b;Pooling=true;Maximum Pool Size=50;Minimum Pool Size=5;Max Auto Prepare=0;No Reset On Close=true;}
      REDIS_URL: redis://127.0.0.1:6379
      Meilisearch__Url: http://127.0.0.1:7700
      Meilisearch__ApiKey: ${MEILI_MASTER_KEY:-meili_secure_master_key_v2_modern_scaling}
    depends_on:
      - redis
      - meilisearch

  portal:
    build:
      context: ../../../apps/portal
      dockerfile: Dockerfile
    image: gaia-portal-web:${GIT_COMMIT:-latest}
    container_name: gaia-portal-web
    restart: unless-stopped
    network_mode: host
    depends_on:
      - api
