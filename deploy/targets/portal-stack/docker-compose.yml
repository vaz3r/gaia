name: gaia-portal-stack

services:
  redis:
    image: redis:7-alpine
    container_name: gaia-portal-redis
    restart: unless-stopped
    command: >
      sh -c 'redis-server
      --requirepass "$$REDIS_PASSWORD"
      --appendonly yes
      --appendfsync everysec
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
      --maxmemory 4gb
      --maxmemory-policy volatile-lru'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - /var/lib/redis/data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: gaia-portal-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-meili_secure_master_key_v2_modern_scaling}
      MEILI_NO_ANALYTICS: "true"
      MEILI_MAX_INDEXING_MEMORY: 16Gb
      MEILI_MAX_INDEXING_THREADS: 6
      MEILI_HTTP_ADDR: 0.0.0.0:7700
    volumes:
      - /var/lib/meilisearch/data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7700/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ../../../apps/api
      dockerfile: Dockerfile
    image: gaia-portal-api:${GIT_COMMIT:-latest}
    container_name: gaia-portal-api
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5000
      DATABASE_URL: ${DATABASE_URL:-Host=192.168.10.10;Port=6432;Database=craw;Username=crawler;Password=83fec11c363e2e90cbea2a0303ace95a8b5d4bbaf897fc97f49195ffbbf7978b;Pooling=true;Maximum Pool Size=50;Minimum Pool Size=5;Max Auto Prepare=0;No Reset On Close=true;}
      ConnectionStrings__Postgres: ${DATABASE_URL:-Host=192.168.10.10;Port=6432;Database=craw;Username=crawler;Password=83fec11c363e2e90cbea2a0303ace95a8b5d4bbaf897fc97f49195ffbbf7978b;Pooling=true;Maximum Pool Size=50;Minimum Pool Size=5;Max Auto Prepare=0;No Reset On Close=true;}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      Meilisearch__Url: http://meilisearch:7700
      Meilisearch__ApiKey: ${MEILI_MASTER_KEY:-meili_secure_master_key_v2_modern_scaling}
    depends_on:
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  sync:
    build:
      context: ../../../apps/sync
      dockerfile: Dockerfile
    image: gaia-portal-sync:${GIT_COMMIT:-latest}
    container_name: gaia-portal-sync
    restart: unless-stopped
    environment:
      DATABASE_URL: Host=192.168.10.10;Port=5432;Database=craw;Username=crawler;Password=83fec11c363e2e90cbea2a0303ace95a8b5d4bbaf897fc97f49195ffbbf7978b;Pooling=false;
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      Meilisearch__Url: http://meilisearch:7700
      Meilisearch__ApiKey: ${MEILI_MASTER_KEY:-meili_secure_master_key_v2_modern_scaling}
      REBUILD_CADENCE_MINUTES: ${REBUILD_CADENCE_MINUTES:-120}
      INITIAL_REBUILD_ON_STARTUP: ${INITIAL_REBUILD_ON_STARTUP:-false}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_AUTH_TOKEN: ${NTFY_AUTH_TOKEN:-}
      NTFY_SERVER: ${NTFY_SERVER:-https://ntfy.sh}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      HEALTHCHECKS_URL: ${HEALTHCHECKS_URL:-}
    depends_on:
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  portal:
    build:
      context: ../../../apps/portal
      dockerfile: Dockerfile
    image: gaia-portal-web:${GIT_COMMIT:-latest}
    container_name: gaia-portal-web
    restart: unless-stopped
    ports:
      - "3005:3005"
    depends_on:
      - api
