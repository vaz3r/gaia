name: gaia-crawler

services:
  crawler:
    build:
      context: ../../../apps/crawler
      dockerfile: Dockerfile
      args:
        CRAW_GIT_HASH: ${GIT_COMMIT:-unknown}
    image: gaia-crawler:${GIT_COMMIT:-latest}
    container_name: gaia-crawler
    init: true
    restart: unless-stopped
    network_mode: host
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-crawler}:${PG_PASSWORD}@${DB_HOST}:${PG_PORT:-5432}/${POSTGRES_DB:-craw}?sslmode=disable
      CRAW_EXTERNAL_IP: ${CRAW_EXTERNAL_IP}
      CRAW_PIPELINE_LIMIT: ${CRAW_PIPELINE_LIMIT:-4000}
      CRAW_FETCH_LIMIT: ${CRAW_FETCH_LIMIT:-1200}
      CRAW_RACE_PEERS: ${CRAW_RACE_PEERS:-12}
      CRAW_WORKERS: ${CRAW_WORKERS:-8}
      CRAW_NODES: ${CRAW_NODES:-1}
      CRAW_SYBILS: ${CRAW_SYBILS:-16}
      CRAW_FIND_NODE_RESPONSE_PERCENT: ${CRAW_FIND_NODE_RESPONSE_PERCENT:-100}
      CRAW_RATE_LIMIT: ${CRAW_RATE_LIMIT:-8.0}
      CRAW_WALKER_ALPHA: ${CRAW_WALKER_ALPHA:-3}
      CRAW_WALKER_INTERVAL_MS: ${CRAW_WALKER_INTERVAL_MS:-250}
      CRAW_PORT_BASE: ${CRAW_PORT_BASE:-6882}
      CRAW_UTP_ENABLED: ${CRAW_UTP_ENABLED:-true}
      CRAW_FETCH_TIMEOUT_MS: ${CRAW_FETCH_TIMEOUT_MS:-25000}
      CRAW_SOURCE_DEADLINE_MS: ${CRAW_SOURCE_DEADLINE_MS:-15000}
      CRAW_LEAD_SOURCE_GRACE_MS: ${CRAW_LEAD_SOURCE_GRACE_MS:-1000}
      CRAW_TCP_TIMEOUT_SECS: ${CRAW_TCP_TIMEOUT_SECS:-5}
      CRAW_UTP_TIMEOUT_SECS: ${CRAW_UTP_TIMEOUT_SECS:-5}
      CRAW_CONN_LIMITER_TTL_SECS: ${CRAW_CONN_LIMITER_TTL_SECS:-60}
      CRAW_CONN_LIMITER_MAX_ENTRIES: ${CRAW_CONN_LIMITER_MAX_ENTRIES:-1000000}
      CRAW_PEER_CACHE_TTL_SECS: ${CRAW_PEER_CACHE_TTL_SECS:-300}
      CRAW_PEER_CACHE_FAILURE_THRESHOLD: ${CRAW_PEER_CACHE_FAILURE_THRESHOLD:-2}
      CRAW_WALKER_SELF_EXPLORE_PROB: ${CRAW_WALKER_SELF_EXPLORE_PROB:-0.25}
      CRAW_JANITOR_INTERVAL: ${CRAW_JANITOR_INTERVAL:-300}
      CRAW_JANITOR_BATCH_SIZE: ${CRAW_JANITOR_BATCH_SIZE:-100000}
      CRAW_JANITOR_BATCH_SLEEP_MS: ${CRAW_JANITOR_BATCH_SLEEP_MS:-10}
      CRAW_JANITOR_DEAD_RETENTION_SECS: ${CRAW_JANITOR_DEAD_RETENTION_SECS:-3600}
      CRAW_TRACE_SAMPLE_RATE: ${CRAW_TRACE_SAMPLE_RATE:-0.01}
      CRAW_LOG_JSON: ${CRAW_LOG_JSON:-true}
      CRAW_LOG_DIR: /data/logs
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - /home/${DEPLOY_USER:-ubuntu}/gaia-data/crawler:/home/crawler/data
      - /home/${DEPLOY_USER:-ubuntu}/gaia-data/logs:/data/logs
      - /home/${DEPLOY_USER:-ubuntu}/gaia/apps/crawler/config:/etc/crawler/config:ro

  log-shipper:
    build:
      context: ../../../apps/log-shipper
    image: gaia-log-shipper:${GIT_COMMIT:-latest}
    container_name: gaia-log-shipper
    restart: unless-stopped
    environment:
      SOURCE_DIR: /logs
      RECEIVER_URL: ${RECEIVER_URL:-http://100.87.194.112:3100}
      API_KEY: ${LOG_SHIPPER_API_KEY}
      SCAN_INTERVAL_MS: 300000
      FILE_MIN_AGE_MS: 120000
      HOST_NAME: gaia-node
    volumes:
      - /home/${DEPLOY_USER:-ubuntu}/gaia-data/logs:/logs
