# Local development override. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Adds a local PostgreSQL, switches to bridge networking, and exposes dashboard port.

services:
  db:
    image: postgres:16
    container_name: craw-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crawler}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-craw}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./pg/postgresql.conf:/etc/postgresql.conf:ro
    command: ["-c", "config_file=/etc/postgresql.conf"]
    ports:
      - "0.0.0.0:${PG_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crawler} -d ${POSTGRES_DB:-craw}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - internal

  crawler:
    network_mode: bridge
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-crawler}:${PG_PASSWORD}@db:5432/${POSTGRES_DB:-craw}?sslmode=disable
      CRAW_EXTERNAL_IP: ${CRAW_EXTERNAL_IP:-127.0.0.1}
    networks:
      - internal

  dashboard:
    network_mode: bridge
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-crawler}:${PG_PASSWORD}@db:5432/${POSTGRES_DB:-craw}?sslmode=disable
    ports:
      - "0.0.0.0:${DASH_PORT:-3000}:3000"
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
    name: craw-pg-data
