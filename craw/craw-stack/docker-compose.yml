services:
  db:
    image: postgres:16
    container_name: craw-db
    environment:
      POSTGRES_USER: crawler
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: craw
    shm_size: 1g
    ports:
      - "0.0.0.0:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped
    command: >
      postgres
        -c shared_buffers=2GB
        -c effective_cache_size=6GB
        -c work_mem=16MB
        -c maintenance_work_mem=512MB
        -c max_connections=200
        -c superuser_reserved_connections=5
        -c wal_buffers=64MB
        -c wal_compression=on
        -c max_wal_size=8GB
        -c min_wal_size=2GB
        -c checkpoint_timeout=15min
        -c checkpoint_completion_target=0.9
        -c synchronous_commit=off
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c bgwriter_delay=200ms
        -c bgwriter_lru_maxpages=1000
        -c autovacuum_vacuum_scale_factor=0.05
        -c autovacuum_analyze_scale_factor=0.02
        -c autovacuum_vacuum_cost_limit=2000
        -c autovacuum_vacuum_cost_delay=2
        -c log_min_duration_statement=1000

volumes:
  pg-data:
